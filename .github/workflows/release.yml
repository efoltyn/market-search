name: release

# Builds prebuilt market-search binaries for every platform the npm wrapper
# (npm/install.js) and install.sh download, and attaches them to the GitHub
# release for the pushed tag. Trigger by pushing a tag like `v0.3.0`
# (must match npm/package.json version).
#
# Asset names MUST match npm/install.js TARGETS and install.sh:
#   market-search-<rust-target>[.exe]
#
# This repo is flat (Cargo.toml at root), so cargo runs from the repo root.

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write      # build provenance attestations
  attestations: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          # The Intel macOS runners are retired (macos-13 left v0.3.0's job queued for 24h);
          # Apple Silicon cross-compiles the Intel binary.
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build (release)
        shell: bash
        run: cargo build --release --target ${{ matrix.target }} --bin market-search

      - name: Stage asset
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release/market-search"
          out="market-search-${{ matrix.target }}"
          if [[ "${{ matrix.target }}" == *windows* ]]; then src="$src.exe"; out="$out.exe"; fi
          cp "$src" "$out"
          ls -lh "$out"

      # Signed provenance tying each binary to this workflow and commit
      # (verify: gh attestation verify <file> --repo efoltyn/market-search).
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: market-search-${{ matrix.target }}*

      - uses: softprops/action-gh-release@v2
        with:
          files: market-search-${{ matrix.target }}*
          fail_on_unmatched_files: true

  # SHA256SUMS for the four binaries; install.sh and install.ps1 verify against it.
  checksums:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Write and attach SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'market-search-*' --dir assets
          (cd assets && sha256sum market-search-* > ../SHA256SUMS)
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
